name: portfolio
description: "Arjun's Portfolio"

publish_to: 'none'

version: 1.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  simple_gradient_text: ^1.3.0
  font_awesome_flutter: ^10.8.0
  animated_text_kit: ^4.2.2
  url_launcher: ^6.3.1
  flutter_svg: ^2.1.0
  provider: ^6.1.5
  go_router: ^17.0.1
  dio: ^5.9.0
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  json_serializable: ^6.11.1
  pretty_dio_logger: ^1.4.0
  flutter_bloc: ^9.1.1
  shimmer: ^3.0.0
  dartz: ^0.10.1
  get_it: ^9.2.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.5.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/svg/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500